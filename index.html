<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFK Store | Diseño Terminado</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body id="Pagina Principal">
<!-----------------------------------------------------------------------------------------------HEADER------------------------------------------------------------------------------------------------------->
    <header>
        <div>
            <i class="fa-solid fa-gamepad"></i> AFK
        </div>
        <nav>
            <ul>
                <li><a href="#">Tienda</a></li>
                <li><a href="#">Biblioteca</a></li>
                <li><a href="#">Comunidad</a></li>
                <li><a href="#">Perfil</a></li>
            </ul>
        </nav>
        <div>
            <div>
                <input type="text" placeholder="Buscar...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <div>
                <i class="fa-regular fa-user"></i>
            </div>
        </div>
    </header>
<!-----------------------------------------------------------------------------------------------HEADER------------------------------------------------------------------------------------------------------->
<!-----------------------------------------------------------------------------------------------MAIN---------------------------------------------------------------------------------------------------------->    
    <main>
        <h2>Destacados</h2>
        <section class="destacados-carrusel">
            <button class="boton-izquierdo"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="Contenedor-Puntos">
                <div class="Puntos"></div>
                <div class="Puntos"></div>
                <div class="Puntos"></div>
                <div class="Puntos"></div>
                <div class="Puntos"></div>
            </div>
            <button class="boton-derecho"><i class="fa-solid fa-chevron-right"></i></button>
        </section>

        <h2>Descuentos</h2>
        <section class="seccion-descuentos">
            <div class="tarjeta-descuentos">
                <div class="tarjeta 1"></div>
                <div>-75%</div>
            </div>
            <div class="tarjeta-descuentos">
                <div class="tarjeta 2"></div>
                <div>-35%</div>
            </div>
        </section>

        <div>
            <a href="#"><i class="fa-solid fa-chevron-left"></i> Previous</a>
            <a href="#">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
            <a href="#">4</a>
            <a href="#">5</a>
            <span>...</span>
            <a href="#">11</a>
            <a href="#">Next <i class="fa-solid fa-chevron-right"></i></a>
        </div>
    </main>
<!-----------------------------------------------------------------------------------------------MAIN---------------------------------------------------------------------------------------------------------->    
<!-----------------------------------------------------------------------------------------------FOOTER---------------------------------------------------------------------------------------------------------->    
    <footer>
        <div>
            <a href="#">Nosotros</a>
            <a href="#">Legal</a>
            <a href="#">Contáctanos</a>
        </div>
        <div class="iconos-redes-sociales">
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        <div>
            AFK @ 2026. Todos los derechos reservados.
        </div>
    </footer>
<!-----------------------------------------------------------------------------------------------FOOTER---------------------------------------------------------------------------------------------------------->    

</body>
</html>
